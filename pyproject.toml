[project]
name = "ai-digital-twin"
version = "1.0.0"
description = "An agentic AI digital twin that represents you to recruiters and clients: RAG, tool use, self-evaluation and a human-in-the-loop Telegram console."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "gradio==6.14.0",
    "numpy",
    "openai",
    "pydantic",
    "pypdf",
    "python-dotenv",
    "requests",
]
